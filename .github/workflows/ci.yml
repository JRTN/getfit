# Continuous integration: runs on GitHub's servers for every push and pull request.
# It has no effect on local builds.
name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: versionCode is the git commit count.
          fetch-depth: 0

      # The JDK Gradle runs on (bytecode still targets 17). Matches Android Studio's bundled JBR
      # locally; Robolectric needs at least Java 21 to emulate Android SDK 36.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests, Konsist, detekt, ktlint, Android Lint
        run: ./gradlew check

      - name: Dependency analysis
        run: ./gradlew buildHealth

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/**
            **/build/test-results/**
