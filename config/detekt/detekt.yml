# Overrides on top of detekt's default rule set (buildUponDefaultConfig = true).
# GetFit's own rules live in :detekt-rules (rule set "getfit"); M1b adds dispatcher and migration rules.

config:
  # :detekt-rules runs detekt without its own rules loaded, so it cannot validate their keys.
  excludes: ['getfit.*']

naming:
  FunctionNaming:
    # Composable functions are PascalCase by convention.
    ignoreAnnotated: ['Composable']

style:
  MagicNumber:
    ignoreAnnotated: ['Composable', 'Preview']
  UnusedPrivateFunction:
    ignoreAnnotated: ['Preview']

getfit:
  NoColorLiteralOutsideDesignSystem:
    active: true
